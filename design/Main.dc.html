<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #F4F1EA; font-family: Manrope, "Segoe UI", system-ui, sans-serif; color: #1B1F1D; }
    a { color: #B85C38; } a:hover { color: #93482B; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F1EA; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: #1B1F1D;">

  <!-- Map -->
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 540px; overflow: hidden;">
    <svg width="390" height="540" viewBox="0 0 390 540" xmlns="http://www.w3.org/2000/svg" style="display: block;">
      <rect width="390" height="540" fill="#ECE6DA"></rect>
      <path d="M-20 120 C 80 90, 140 170, 230 130 S 380 60, 420 110 L 420 190 C 340 160, 280 230, 200 210 S 60 150, -20 200 Z" fill="#CBD9DF"></path>
      <path d="M40 300 L 200 260 L 250 360 L 110 420 Z" fill="#D5DDC6"></path>
      <path d="M270 380 L 380 350 L 400 440 L 300 470 Z" fill="#D5DDC6"></path>
      <g stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round">
        <path d="M0 250 L 390 220"></path>
        <path d="M120 0 L 150 540"></path>
        <path d="M0 460 L 390 400"></path>
        <path d="M280 0 L 300 540"></path>
      </g>
      <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
        <path d="M0 330 L 390 300"></path>
        <path d="M60 0 L 80 540"></path>
        <path d="M200 0 L 215 540"></path>
        <path d="M340 0 L 355 540"></path>
        <path d="M0 160 L 120 150"></path>
        <path d="M150 380 L 280 360"></path>
      </g>
      <g fill="#E3DCCB">
        <rect x="160" y="240" width="30" height="40" rx="3"></rect>
        <rect x="222" y="232" width="48" height="30" rx="3"></rect>
        <rect x="30" y="480" width="70" height="40" rx="3"></rect>
        <rect x="310" y="120" width="26" height="60" rx="3"></rect>
        <rect x="160" y="470" width="32" height="50" rx="3"></rect>
      </g>
      <!-- other places -->
      <g>
        <circle cx="96" cy="292" r="10" fill="#B85C38" stroke="#FFFFFF" stroke-width="3"></circle>
        <circle cx="262" cy="262" r="10" fill="#B85C38" stroke="#FFFFFF" stroke-width="3"></circle>
        <circle cx="318" cy="395" r="10" fill="#B85C38" stroke="#FFFFFF" stroke-width="3"></circle>
        <circle cx="68" cy="440" r="10" fill="#B85C38" stroke="#FFFFFF" stroke-width="3"></circle>
        <circle cx="236" cy="150" r="10" fill="#B85C38" stroke="#FFFFFF" stroke-width="3"></circle>
      </g>
      <!-- current location -->
      <circle cx="190" cy="330" r="26" fill="#2F6B8A" opacity="0.16"></circle>
      <circle cx="190" cy="330" r="9" fill="#2F6B8A" stroke="#FFFFFF" stroke-width="3"></circle>
      <!-- selected place -->
      <g transform="translate(176 268)">
        <path d="M14 0 C 6 0, 0 6, 0 14 C 0 24, 14 38, 14 38 S 28 24, 28 14 C 28 6, 22 0, 14 0 Z" fill="#1B1F1D"></path>
        <circle cx="14" cy="14" r="5" fill="#F4F1EA"></circle>
      </g>
    </svg>

    <!-- Selected place label -->
    <div style="position: absolute; left: 116px; top: 214px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1B1F1D; color: #F4F1EA; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(27,31,29,0.18);">
      <span>Eiffel Tower</span>
      <span style="color: #D9B49C; font-weight: 500;">20 m</span>
    </div>

    <!-- Top bar -->
    <div style="position: absolute; left: 20px; right: 20px; top: 56px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; background: rgba(251,249,245,0.94); border-radius: 22px; box-shadow: 0 4px 14px rgba(27,31,29,0.10);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B85C38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span style="font-size: 14px; font-weight: 600;">Paris, 7e</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 14px; background: rgba(251,249,245,0.94); border-radius: 22px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; box-shadow: 0 4px 14px rgba(27,31,29,0.10);">EN</div>
    </div>

    <!-- Locate me -->
    <div style="position: absolute; right: 20px; top: 430px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #FBF9F5; border-radius: 24px; box-shadow: 0 6px 16px rgba(27,31,29,0.14);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F1D" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 356px; background: #FBF9F5; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px rgba(27,31,29,0.12); display: flex; flex-direction: column;">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #D8D2C6; margin: 10px auto 0;"></div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 24px 0;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 32px;">Around you</div>
        <div style="font-size: 13px; color: #6F6B63;">30 places within 1 km</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #DDD7CB; border-radius: 16px; font-size: 13px; font-weight: 600; color: #1B1F1D;">
        <span>1 km</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B1F1D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; padding: 16px 20px 0; gap: 4px;">

      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; background: #F1ECE2; border-radius: 18px;">
        <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: #B6A48A;">
          <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><rect width="56" height="56" fill="#C9B79B"></rect><path d="M28 8 L34 40 L22 40 Z" fill="#6E5A44"></path><path d="M14 48 L42 48 L38 40 L18 40 Z" fill="#6E5A44"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
          <div style="font-size: 16px; font-weight: 700;">Eiffel Tower</div>
          <div style="font-size: 13px; color: #6F6B63;">Tower in Paris, France</div>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #B85C38;">20 m</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px;">
        <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: #A9B7B0;">
          <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><rect width="56" height="56" fill="#B8C4BC"></rect><path d="M0 30 Q 14 18, 28 30 T 56 30 L 56 56 L 0 56 Z" fill="#5C6E66"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
          <div style="font-size: 16px; font-weight: 700;">Pont d'Iéna</div>
          <div style="font-size: 13px; color: #6F6B63;">Bridge in Paris</div>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #B85C38;">220 m</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px;">
        <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: #C89E7A;">
          <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><rect width="56" height="56" fill="#D4AC8A"></rect><rect x="10" y="22" width="36" height="26" fill="#7A4E33"></rect><rect x="16" y="14" width="24" height="10" fill="#7A4E33"></rect></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
          <div style="font-size: 16px; font-weight: 700;">Musée du quai Branly</div>
          <div style="font-size: 13px; color: #6F6B63;">Museum for indigenous art</div>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #B85C38;">350 m</div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px;">
        <div style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; background: #9DB08B;">
          <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><rect width="56" height="56" fill="#AEC09B"></rect><circle cx="20" cy="30" r="10" fill="#5F7A4C"></circle><circle cx="36" cy="26" r="12" fill="#5F7A4C"></circle><rect x="0" y="42" width="56" height="14" fill="#5F7A4C"></rect></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
          <div style="font-size: 16px; font-weight: 700;">Champ de Mars</div>
          <div style="font-size: 13px; color: #6F6B63;">Public park in Paris</div>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #B85C38;">410 m</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
